name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    name: offline gates (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      # make check runs: gofmt, vet, build, test, golden vectors, race, import
      # boundary, lint (golangci-lint). Absent on purpose: evaluator determinism
      # (A1-04), arm64 golden outputs (A2-05).
      - name: Install golangci-lint
        # Installed (not run) here so `make check` stays the single gate entry,
        # identical to the local run. The installer script and the version are
        # both pinned to the immutable tag v2.14.0; `make lint` refuses any other
        # installed version, so a drift fails instead of passing silently.
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/v2.14.0/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" v2.14.0

      - name: Gates
        run: make check
